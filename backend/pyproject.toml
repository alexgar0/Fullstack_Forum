[project]
name = "backend"
version = "0.1.0"
description = "A backend for Forum"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "dotenv>=0.9.9",
    "fastapi>=0.135.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.11.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "types-python-jose>=3.5.0.20250531",
    "types-passlib>=1.7.7.20260211",
    "testcontainers[postgres]>=4.15.0",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[project.scripts]
start = "forum.core.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forum"]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4
fix = true
show-fixes = true
respect-gitignore = true

extend-exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "TCH",    # flake8-type-checking (legacy prefix)
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "PIE",    # flake8-pie
    "RSE",    # flake8-raise
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "PL",     # Pylint
    "PERF",   # Perflint
    "FURB",   # refurb
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "DTZ",    # flake8-datetimez
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "TRY",    # tryceratops
    "EM",     # flake8-errmsg
    "FBT",    # flake8-boolean-trap
    "ANN",    # flake8-annotations
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "PT",     # flake8-pytest-style
    "RUF",    # Ruff-specific
]

ignore = [
    # Formatter manages line length
    "E501",

    # Docstrings: Google style
    "D100",   # Missing module docstring
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing package docstring
    "D106",   # Missing docstring in public nested class
    "D107",   # Missing __init__ docstring
    "D203",   # Conflicts with D211
    "D213",   # Conflicts with D212

    # Annotations
    "ANN401", # Dynamically typed expressions (Any)

    # Exceptions
    "TRY003", # Long exception messages
    "EM101",  # String literal in exception
    "EM102",  # f-string in exception

    # Boolean arguments
    "FBT001",
    "FBT002",
    "FBT003",

    # Complexity / style
    "PLR0913", # Too many function arguments
    "PLR2004", # Magic values
    "PLC0415", # Imports outside top-level

    # Documentation
    "D205",
]

unfixable = [
    "S",       # Security issues should be reviewed manually
    "BLE",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "declared_attr",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert
    "S105",    # Hardcoded test passwords
    "S106",
    "ARG001",  # Fixture arguments
    "ARG002",
    "SLF001",  # Private member access
    "PLR2004",
    "D",
    "ANN",
]


"**/migrations/*.py" = [
    "ALL",
]

"**/alembic/*.py" = [
    "ALL",
]

"**/versions/*.py" = [
    "ALL",
]

"**/__init__.py" = [
    "F401",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = false
split-on-trailing-comma = true
known-first-party = [
    "app",
    "apps",
    "src",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"