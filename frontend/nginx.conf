server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Раздача статики без лишней философии
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Можно добавить небольшой кеш для ассетов
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}